[package]
name = "coms"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
futures = "0.3.34"
# serialport = "4.10.1"
tokio = { version = "1.53.2" , features = ["full"]}
tokio-serial = "5.5.0"
tokio-util = { version = "0.7.20", features = ["codec"] }

[features]
default = ["std"]
std = []

[lints.clippy]
pedantic = "warn"
nursery = "warn"
complexity = "warn"
cargo = "warn"
perf = "warn"
style = "warn"
correctness = "deny"
