[package]
name = "coms"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = {version ="1.25.2", optional = true}
futures = { version ="0.3.34", optional = true }
tokio = { version = "1.53.2" , features = ["full"], optional = true }
tokio-serial = { version ="5.5.0", optional = true }
tokio-util = { version = "0.7.20", features = ["codec"], optional = true }

[features]
default = ["std"]
std = ["dep:futures","dep:tokio", "dep:tokio-serial", "dep:tokio-util","dep:bytemuck"]

[lints.clippy]
pedantic = "warn"
nursery = "warn"
complexity = "warn"
cargo = "warn"
perf = "warn"
style = "warn"
correctness = "deny"
